<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svg_FlowChart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      padding: 20px;
      background: #f0f2f5;
    }
    /* 画布容器单独区域 */
    #canvas-container {
      width: 100%;
      height: 700px;
      border: 2px solid #ccc;
      background: #fff;
      overflow: hidden;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
    }
    /* 按钮悬浮层 */
    .tool-bar {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 999;
    }
    #addNodeBtn {
      padding: 6px 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="tool-bar">
    <button id="addNodeBtn">新增节点</button>
  </div>
  <!-- 独立画布容器 -->
  <div id="canvas-container"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
