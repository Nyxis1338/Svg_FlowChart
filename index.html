<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svg_FlowChart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    /* 画布容器全屏铺满 */
    #app {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    svg {
      display: block;
      user-select: none;
    }
  </style>
</head>
<body>
  <!-- 新增节点按钮 -->
  <div style="position:fixed;top:12px;left:12px;z-index:999;">
    <button id="addNodeBtn" style="padding:6px 12px;cursor:pointer;">新增节点</button>
  </div>
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
