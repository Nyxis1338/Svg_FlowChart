<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Stub 垂直引出演示（多种连线类型）</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        padding: 20px;
        font-family: 'Segoe UI', sans-serif;
        background: #f5f7fa;
      }
      h2 {
        margin-bottom: 12px;
        font-weight: 400;
      }
      #container {
        width: 100%;
        height: 600px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      #log {
        margin-top: 12px;
        padding: 8px 14px;
        background: #1e1e1e;
        color: #d4d4d4;
        border-radius: 4px;
        font-family: monospace;
        font-size: 13px;
        max-height: 120px;
        overflow-y: auto;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .toolbar button {
        padding: 6px 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
        transition: 0.2s;
      }
      .toolbar button:hover {
        background: #e3f2fd;
        border-color: #1976d2;
      }
    </style>
  </head>
  <body>
    <h2>🧪 Stub 垂直引出 + 箭头调试（直线 / 流程图 / 贝塞尔）</h2>
    <div class="toolbar">
      <button id="btn-reset">重置节点位置</button>
      <span style="margin-left: auto; font-size: 13px; color: #555">💡 控制台执行 getArrowInfo() 查看箭头信息</span>
    </div>
    <div id="container"></div>
    <div id="log">初始化... 拖动节点观察 stub 和箭头</div>

    <script type="importmap">
      { "imports": { "svg-flowchart": "../../src/" } }
    </script>
    <script type="module">
      import { SvgEngine } from '../../src/core/SvgEngine';
      import { Defaults } from '../../src/styles/defaults';

      const container = document.getElementById('container');
      const chart = new SvgEngine(container);
      window.chart = chart;
      const store = chart.store;
      const logEl = document.getElementById('log');

      function log(msg) {
        logEl.textContent = msg;
        console.log(msg);
      }

      // ---- 辅助：添加四个方向锚点 ----
      function addAnchors(nodeId) {
        chart.addAnchor({
          nodeId,

          position: 'top',
          direction: 'output',
          radius: 5,
        });
        chart.addAnchor({
          nodeId,

          position: 'right',
          direction: 'output',
          radius: 5,
        });
        chart.addAnchor({
          nodeId,

          position: 'bottom',
          direction: 'input',
          radius: 5,
        });
        chart.addAnchor({
          nodeId,

          position: 'left',
          direction: 'input',
          radius: 5,
        });
      }

      // ---- 创建四个节点 ----
      const nodeA = chart.addNode({
        x: 60,
        y: 60,
        width: 140,
        height: 90,
        label: 'A',
        shape: 'rectangle',
        stroke: '#7b1fa2',
        strokeWidth: 3,
      });
      addAnchors(nodeA.id);

      const nodeB = chart.addNode({
        x: 360,
        y: 60,
        width: 140,
        height: 90,
        label: 'B',
        shape: 'rectangle',
        stroke: '#7b1fa2',
        strokeWidth: 3,
      });
      addAnchors(nodeB.id);

      const nodeC = chart.addNode({
        x: 200,
        y: 260,
        width: 140,
        height: 90,
        label: 'C',
        shape: 'diamond',
        stroke: '#7b1fa2',
        strokeWidth: 3,
      });
      addAnchors(nodeC.id);

      const nodeD = chart.addNode({
        x: 480,
        y: 260,
        width: 140,
        height: 90,
        label: 'D',
        shape: 'ellipse',
        stroke: '#7b1fa2',
        strokeWidth: 3,
      });
      addAnchors(nodeD.id);

      // ---- 1. 直线（红色） ----
      const aRight = store.getNodeAnchors(nodeA.id).find(a => a.position === 'right');
      const bLeft = store.getNodeAnchors(nodeB.id).find(a => a.position === 'left');
      if (aRight && bLeft) {
        chart.addConnection({
          connectorType: 'straight',
          sourceAnchorId: aRight.id,
          targetAnchorId: bLeft.id,
          stroke: '#e74c3c',
          strokeWidth: 3,
          stub: 40,
          gap: 0,
          arrow: { direction: 'target', length: 18, type: 'triangle' },
        });
      }

      // ---- 2. 流程图（绿色） ----
      const aBottom = store.getNodeAnchors(nodeA.id).find(a => a.position === 'bottom');
      const cTop = store.getNodeAnchors(nodeC.id).find(a => a.position === 'top');
      if (aBottom && cTop) {
        chart.addConnection({
          connectorType: 'flowchart',
          sourceAnchorId: aBottom.id,
          targetAnchorId: cTop.id,
          stroke: '#2ecc71',
          strokeWidth: 3,
          stub: 40,
          gap: 0,
          arrow: { direction: 'target', length: 18, type: 'triangle' },
        });
      }

      // ---- 3. 贝塞尔（紫色） ----
      const bRight = store.getNodeAnchors(nodeB.id).find(a => a.position === 'right');
      const dLeft = store.getNodeAnchors(nodeD.id).find(a => a.position === 'left');
      if (bRight && dLeft) {
        chart.addConnection({
          connectorType: 'bezier',
          sourceAnchorId: bRight.id,
          targetAnchorId: dLeft.id,
          stroke: '#9b59b6',
          strokeWidth: 3,
          stub: 40,
          gap: 0,
          arrow: { direction: 'target', length: 18, type: 'fork' },
        });
      }

      log('✅ 就绪。三种连线类型均显示 stub（法线方向）。箭头：直线/流程图用三角形，贝塞尔用三叉。');

      // ---- 重置按钮 ----
      document.getElementById('btn-reset').addEventListener('click', () => {
        chart.updateNode(nodeA.id, { x: 60, y: 60 });
        chart.updateNode(nodeB.id, { x: 360, y: 60 });
        chart.updateNode(nodeC.id, { x: 200, y: 260 });
        chart.updateNode(nodeD.id, { x: 480, y: 260 });
        log('节点位置已重置');
      });

      // ---- 挂载调试辅助到全局 ----
      window.getArrowInfo = function (connId) {
        const conn = connId ? store.getConnection(connId) : store.getAllConnections()[0];
        if (!conn) {
          console.warn('未找到连线');
          return;
        }
        const arrow = conn.arrow;
        if (!arrow || arrow.direction === 'none') {
          console.warn('该连线没有箭头');
          return;
        }
        const pathInfo = store.computeConnectionPath(conn);
        if (!pathInfo) {
          console.warn('无法计算路径');
          return;
        }
        const { startDirection, endDirection, start, end } = pathInfo;

        console.group('箭头信息');
        console.log('连线 ID:', conn.id);
        console.log('箭头配置:', arrow);
        console.log('起点:', start);
        console.log('终点:', end);

        // 根据方向选择对应的方向向量
        const dir = arrow.direction === 'target' ? endDirection : arrow.direction === 'source' ? startDirection : null;
        if (!dir) {
          console.warn('方向向量为空');
          console.groupEnd();
          return;
        }
        const angleDeg = (Math.atan2(dir.y, dir.x) * 180) / Math.PI;
        console.log('方向向量:', dir);
        console.log('方向角度（度）:', angleDeg);

        const length = arrow.length || Defaults.arrow.length;
        const width = arrow.width || Defaults.arrow.width;
        console.log('箭头长度:', length);
        console.log('箭头宽度:', width);
        const tipAngle = (2 * Math.atan2(width / 2, length) * 180) / Math.PI;
        console.log('箭头顶角（度）:', tipAngle.toFixed(2));

        console.groupEnd();
      };

      console.log('💡 在控制台执行 getArrowInfo() 可查看第一条连线的箭头信息，传入连线ID可查看指定连线');
    </script>
  </body>
</html>
