<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Stub 方向测试</title>
    <style>
      body {
        padding: 20px;
        font-family: sans-serif;
        background: #f5f7fa;
      }
      #container {
        width: 100%;
        height: 600px;
        background: #fff;
        border-radius: 8px;
      }
      .tip {
        background: #e3f2fd;
        padding: 8px 14px;
        border-radius: 4px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <h2>🧭 Stub 方向测试（Flowchart 连线）</h2>
    <div class="tip">每个节点的锚点方向固定：A 右 → B 左，A 下 → C 上，B 下 → D 上。观察 stub 是否垂直向外。</div>
    <div id="container"></div>

    <script type="importmap">
      { "imports": { "svg-flowchart": "../../src/" } }
    </script>
    <script type="module">
      import { SvgEngine } from '../../src/core/SvgEngine';
      import { NodeShape, AnchorPosition, AnchorType, ConnectorType, ArrowDirection } from '../../src/types/SvgModel';

      const container = document.getElementById('container');
      const chart = new SvgEngine(container);
      window.chart = chart;
      const store = chart.store;

      // 辅助：添加四个方向的静态锚点
      function addAnchors(nodeId) {
        chart.addAnchor({
          nodeId,
          type: AnchorType.STATIC,
          position: AnchorPosition.TOP,
          direction: 'output',
          radius: 5,
        });
        chart.addAnchor({
          nodeId,
          type: AnchorType.STATIC,
          position: AnchorPosition.RIGHT,
          direction: 'output',
          radius: 5,
        });
        chart.addAnchor({
          nodeId,
          type: AnchorType.STATIC,
          position: AnchorPosition.BOTTOM,
          direction: 'output',
          radius: 5,
        });
        chart.addAnchor({
          nodeId,
          type: AnchorType.STATIC,
          position: AnchorPosition.LEFT,
          direction: 'output',
          radius: 5,
        });
      }

      // 创建四个节点
      const nodeA = chart.addNode({ x: 80, y: 80, width: 120, height: 80, label: 'A', shape: NodeShape.RECTANGLE });
      const nodeB = chart.addNode({ x: 380, y: 80, width: 120, height: 80, label: 'B', shape: NodeShape.RECTANGLE });
      const nodeC = chart.addNode({ x: 80, y: 280, width: 120, height: 80, label: 'C', shape: NodeShape.RECTANGLE });
      const nodeD = chart.addNode({ x: 380, y: 280, width: 120, height: 80, label: 'D', shape: NodeShape.RECTANGLE });
      [nodeA, nodeB, nodeC, nodeD].forEach(n => addAnchors(n.id));

      // 获取锚点
      const aRight = store.getNodeAnchors(nodeA.id).find(a => a.position === AnchorPosition.RIGHT);
      const bLeft = store.getNodeAnchors(nodeB.id).find(a => a.position === AnchorPosition.LEFT);
      const aBottom = store.getNodeAnchors(nodeA.id).find(a => a.position === AnchorPosition.BOTTOM);
      const cTop = store.getNodeAnchors(nodeC.id).find(a => a.position === AnchorPosition.TOP);
      const bBottom = store.getNodeAnchors(nodeB.id).find(a => a.position === AnchorPosition.BOTTOM);
      const dTop = store.getNodeAnchors(nodeD.id).find(a => a.position === AnchorPosition.TOP);

      // 创建三条 Flowchart 连线
      if (aRight && bLeft) {
        chart.addConnection({
          connectorType: ConnectorType.FLOWCHART,
          sourceAnchorId: aRight.id,
          targetAnchorId: bLeft.id,
          stroke: '#e74c3c',
          strokeWidth: 2,
          label: { text: '右→左', fontSize: 12, color: '#333' },
          stub: 30,
        });
      }
      if (aBottom && cTop) {
        chart.addConnection({
          connectorType: ConnectorType.FLOWCHART,
          sourceAnchorId: aBottom.id,
          targetAnchorId: cTop.id,
          stroke: '#2ecc71',
          strokeWidth: 2,
          label: { text: '下→上', fontSize: 12, color: '#333' },
          stub: 30,
        });
      }
      if (bBottom && dTop) {
        chart.addConnection({
          connectorType: ConnectorType.FLOWCHART,
          sourceAnchorId: bBottom.id,
          targetAnchorId: dTop.id,
          stroke: '#3498db',
          strokeWidth: 2,
          label: { text: '下→上', fontSize: 12, color: '#333' },
          stub: 30,
        });
      }

      console.log('✅ Stub 测试示例已加载。拖动节点可观察 stub 是否始终垂直向外。');
    </script>
  </body>
</html>
