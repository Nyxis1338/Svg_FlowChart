<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Stub 垂直引出 + 多形状多连线演示</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        padding: 20px;
        font-family: 'Segoe UI', sans-serif;
        background: #f5f7fa;
      }
      h2 {
        margin-bottom: 12px;
        font-weight: 400;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .toolbar button {
        padding: 6px 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
        transition: 0.2s;
      }
      .toolbar button:hover {
        background: #e3f2fd;
        border-color: #1976d2;
      }
      #container {
        width: 100%;
        height: 600px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      #log {
        margin-top: 12px;
        padding: 8px 14px;
        background: #1e1e1e;
        color: #d4d4d4;
        border-radius: 4px;
        font-family: monospace;
        font-size: 13px;
        max-height: 120px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h2>🧪 Stub 垂直引出 + 四种节点 · 三种连线</h2>
    <div class="toolbar">
      <button id="btn-reset">重置节点位置</button>
      <span style="margin-left: auto; font-size: 13px; color: #555">💡 控制台执行 getArrowInfo() 查看箭头信息</span>
    </div>
    <div id="container"></div>
    <div id="log">初始化... 拖动节点观察 stub 和箭头</div>

    <script src="../../dist/svgflow.umd.js"></script>
    <script>
      const { SvgEngine, Defaults } = window.SvgFlow;
      const container = document.getElementById('container');
      const SE = new SvgEngine(container);
      window.SE = SE;
      const logEl = document.getElementById('log');

      function log(msg) {
        logEl.textContent = msg;
        console.log(msg);
      }

      // ---- 辅助：添加四个角锚点（全部 both） ----
      function addCornerAnchors(nodeId) {
        SE.addAnchor({ nodeId, position: 'top-left', radius: 5 });
        SE.addAnchor({ nodeId, position: 'top-right', radius: 5 });
        SE.addAnchor({ nodeId, position: 'bottom-left', radius: 5 });
        SE.addAnchor({ nodeId, position: 'bottom-right', radius: 5 });
      }

      // ---- 创建 4 个节点 ----
      const nodeA = SE.addNode({
        x: 60,
        y: 60,
        width: 120,
        height: 120,
        label: '菱形A',
        shape: 'diamond',
        stroke: '#7b1fa2',
        strokeWidth: 3,
      });
      addCornerAnchors(nodeA.id);

      const nodeB = SE.addNode({
        x: 440,
        y: 60,
        width: 150,
        height: 110,
        label: '椭圆B',
        shape: 'ellipse',
        stroke: '#7b1fa2',
        strokeWidth: 3,
      });
      addCornerAnchors(nodeB.id);

      const nodeC = SE.addNode({
        x: 60,
        y: 320,
        width: 130,
        height: 90,
        label: '矩形C',
        shape: 'rectangle',
        stroke: '#7b1fa2',
        strokeWidth: 3,
      });
      addCornerAnchors(nodeC.id);

      const nodeD = SE.addNode({
        x: 440,
        y: 320,
        width: 110,
        height: 110,
        label: '圆形D',
        shape: 'circle',
        stroke: '#7b1fa2',
        strokeWidth: 3,
      });
      addCornerAnchors(nodeD.id);

      // ---- 获取锚点 ----
      const aTopRight = SE.getNodeAnchors(nodeA.id).find(a => a.position === 'top-right');
      const aBottomLeft = SE.getNodeAnchors(nodeA.id).find(a => a.position === 'bottom-left');
      const aBottomRight = SE.getNodeAnchors(nodeA.id).find(a => a.position === 'bottom-right');
      const bTopLeft = SE.getNodeAnchors(nodeB.id).find(a => a.position === 'top-left');
      const bBottomLeft = SE.getNodeAnchors(nodeB.id).find(a => a.position === 'bottom-left');
      const cTopRight = SE.getNodeAnchors(nodeC.id).find(a => a.position === 'top-right');
      const cBottomRight = SE.getNodeAnchors(nodeC.id).find(a => a.position === 'bottom-right');
      const dTopLeft = SE.getNodeAnchors(nodeD.id).find(a => a.position === 'top-left');
      const dBottomLeft = SE.getNodeAnchors(nodeD.id).find(a => a.position === 'bottom-left');

      // ---- 1. 直线（红色） ----
      if (aBottomRight && bBottomLeft) {
        SE.addConnection({
          connectorType: 'straight',
          sourceAnchorId: aBottomRight.id,
          targetAnchorId: bBottomLeft.id,
          stroke: '#e74c3c',
          strokeWidth: 3,
          stub: 40,
          gap: 0,
          arrow: { direction: 'target', length: 18, type: 'triangle' },
        });
      }

      // ---- 2. 贝塞尔（绿色） ----
      if (aTopRight && bTopLeft) {
        SE.addConnection({
          connectorType: 'bezier',
          sourceAnchorId: aTopRight.id,
          targetAnchorId: bTopLeft.id,
          stroke: '#2ecc71',
          strokeWidth: 3,
          stub: 40,
          gap: 0,
          arrow: { direction: 'target', length: 18, type: 'fork' },
        });
      }

      // ---- 3. 流程图（蓝色） ----
      if (cBottomRight && dBottomLeft) {
        SE.addConnection({
          connectorType: 'flowchart',
          sourceAnchorId: cBottomRight.id,
          targetAnchorId: dBottomLeft.id,
          stroke: '#3498db',
          strokeWidth: 3,
          stub: 40,
          gap: 0,
          arrow: { direction: 'target', length: 18, type: 'triangle' },
        });
      }

      // ---- 4. 额外直线（橙色） ----
      if (cTopRight && dTopLeft) {
        SE.addConnection({
          connectorType: 'straight',
          sourceAnchorId: cTopRight.id,
          targetAnchorId: dTopLeft.id,
          stroke: '#f39c12',
          strokeWidth: 2,
          stub: 30,
          gap: 0,
          arrow: { direction: 'target', length: 14, type: 'triangle' },
        });
      }

      log('✅ 就绪。4 个节点，分散 4 条连线（直线·贝塞尔·流程图·附加直线）。拖动节点观察 stub 和箭头。');

      document.getElementById('btn-reset').addEventListener('click', () => {
        SE.updateNode(nodeA.id, { x: 60, y: 60 });
        SE.updateNode(nodeB.id, { x: 440, y: 60 });
        SE.updateNode(nodeC.id, { x: 60, y: 320 });
        SE.updateNode(nodeD.id, { x: 440, y: 320 });
        log('节点位置已重置');
      });

      window.getArrowInfo = function (connId) {
        const conn = connId ? SE.getConnection(connId) : SE.getAllConnections()[0];
        if (!conn) {
          console.warn('未找到连线');
          return;
        }
        const arrow = conn.arrow;
        if (!arrow || arrow.direction === 'none') {
          console.warn('该连线没有箭头');
          return;
        }
        const pathInfo = SE.store.computeConnectionPath(conn);
        if (!pathInfo) {
          console.warn('无法计算路径');
          return;
        }
        const { startDirection, endDirection, start, end } = pathInfo;

        console.group('箭头信息');
        console.log('连线 ID:', conn.id);
        console.log('箭头配置:', arrow);
        console.log('起点:', start);
        console.log('终点:', end);

        const dir = arrow.direction === 'target' ? endDirection : arrow.direction === 'source' ? startDirection : null;
        if (!dir) {
          console.warn('方向向量为空');
          console.groupEnd();
          return;
        }
        const angleDeg = (Math.atan2(dir.y, dir.x) * 180) / Math.PI;
        console.log('方向向量:', dir);
        console.log('方向角度（度）:', angleDeg);

        const length = arrow.length || Defaults.arrow.length;
        const width = arrow.width || Defaults.arrow.width;
        console.log('箭头长度:', length);
        console.log('箭头宽度:', width);
        const tipAngle = (2 * Math.atan2(width / 2, length) * 180) / Math.PI;
        console.log('箭头顶角（度）:', tipAngle.toFixed(2));
        console.groupEnd();
      };

      console.log('💡 在控制台执行 getArrowInfo() 可查看第一条连线的箭头信息，传入连线ID可查看指定连线');
    </script>
  </body>
</html>
