<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Stub 垂直引出 + 多形状多连线演示</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        padding: 20px;
        font-family: 'Segoe UI', sans-serif;
        background: #f5f7fa;
      }
      h2 {
        margin-bottom: 12px;
        font-weight: 400;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .toolbar button {
        padding: 6px 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
        transition: 0.2s;
      }
      .toolbar button:hover {
        background: #e3f2fd;
        border-color: #1976d2;
      }
      #container {
        width: 100%;
        height: 600px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      #log {
        margin-top: 12px;
        padding: 8px 14px;
        background: #1e1e1e;
        color: #d4d4d4;
        border-radius: 4px;
        font-family: monospace;
        font-size: 13px;
        max-height: 120px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      .status {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 12px;
        margin-left: 8px;
      }
      .ok {
        background: #2ecc71;
        color: #fff;
      }
      .err {
        background: #e74c3c;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h2>🧪 Stub 垂直引出 + 三种连线样式</h2>
    <div class="toolbar">
      <button id="btn-reset">重置节点位置</button>
      <span style="margin-left: auto; font-size: 13px; color: #555">💡 控制台执行 getArrowInfo() 查看箭头信息</span>
    </div>
    <div id="container"></div>
    <div id="log">初始化... 拖动节点观察 stub 和箭头</div>

    <script type="importmap">
      { "imports": { "svg-flowchart": "../../src/" } }
    </script>
    <script type="module">
      import { SvgEngine } from '../../src/core/SvgEngine';
      import { Defaults } from '../../src/styles/defaults';

      const container = document.getElementById('container');
      const chart = new SvgEngine(container);
      window.chart = chart;
      const store = chart.store;
      const logEl = document.getElementById('log');

      function log(msg) {
        logEl.textContent = msg;
        console.log(msg);
      }

      // ---- 辅助：添加四个角锚点（两个 output，两个 input） ----
      function addCornerAnchors(nodeId) {
        chart.addAnchor({
          nodeId,
          position: 'top-left',
          direction: 'output',
          radius: 5,
        });
        chart.addAnchor({
          nodeId,
          position: 'bottom-left',
          direction: 'output',
          radius: 5,
        });
        chart.addAnchor({
          nodeId,
          position: 'top-right',
          direction: 'input',
          radius: 5,
        });
        chart.addAnchor({
          nodeId,
          position: 'bottom-right',
          direction: 'input',
          radius: 5,
        });
      }

      // ---- 创建菱形节点（左） ----
      const nodeA = chart.addNode({
        x: 80,
        y: 120,
        width: 140,
        height: 140,
        label: '菱形',
        shape: 'diamond',
        stroke: '#7b1fa2',
        strokeWidth: 3,
      });
      addCornerAnchors(nodeA.id);

      // ---- 创建椭圆节点（右） ----
      const nodeB = chart.addNode({
        x: 460,
        y: 120,
        width: 160,
        height: 140,
        label: '椭圆',
        shape: 'ellipse',
        stroke: '#7b1fa2',
        strokeWidth: 3,
      });
      addCornerAnchors(nodeB.id);

      // ---- 获取锚点（output 源，input 目标） ----
      const aTopLeft = store.getNodeAnchors(nodeA.id).find(a => a.position === 'top-left'); // output
      const aBottomLeft = store.getNodeAnchors(nodeA.id).find(a => a.position === 'bottom-left'); // output
      const bTopRight = store.getNodeAnchors(nodeB.id).find(a => a.position === 'top-right'); // input
      const bBottomRight = store.getNodeAnchors(nodeB.id).find(a => a.position === 'bottom-right'); // input

      // ---- 1. 直线（红色）：左上 → 右上 ----
      if (aTopLeft && bTopRight) {
        chart.addConnection({
          connectorType: 'straight',
          sourceAnchorId: aTopLeft.id,
          targetAnchorId: bTopRight.id,
          stroke: '#e74c3c',
          strokeWidth: 3,
          stub: 40,
          gap: 0,
          arrow: { direction: 'target', length: 18, type: 'triangle' },
        });
      }

      // ---- 2. 贝塞尔（绿色）：左下 → 右下 ----
      if (aBottomLeft && bBottomRight) {
        chart.addConnection({
          connectorType: 'bezier',
          sourceAnchorId: aBottomLeft.id,
          targetAnchorId: bBottomRight.id,
          stroke: '#2ecc71',
          strokeWidth: 3,
          stub: 40,
          gap: 0,
          arrow: { direction: 'target', length: 18, type: 'fork' },
        });
      }

      // ---- 3. 流程图（蓝色）：左上 → 右下（交叉，但路径不同） ----
      if (aTopLeft && bBottomRight) {
        chart.addConnection({
          connectorType: 'flowchart',
          sourceAnchorId: aTopLeft.id,
          targetAnchorId: bBottomRight.id,
          stroke: '#3498db',
          strokeWidth: 3,
          stub: 40,
          gap: 0,
          arrow: { direction: 'target', length: 18, type: 'triangle' },
        });
      }

      log('✅ 就绪。三种连线样式：直线（红/上）、贝塞尔（绿/下）、流程图（蓝/交叉）。拖动节点观察 stub 和箭头。');

      // ---- 重置按钮 ----
      document.getElementById('btn-reset').addEventListener('click', () => {
        chart.updateNode(nodeA.id, { x: 80, y: 120 });
        chart.updateNode(nodeB.id, { x: 460, y: 120 });
        log('节点位置已重置');
      });

      // ---- 调试辅助 ----
      window.getArrowInfo = function (connId) {
        const conn = connId ? store.getConnection(connId) : store.getAllConnections()[0];
        if (!conn) {
          console.warn('未找到连线');
          return;
        }
        const arrow = conn.arrow;
        if (!arrow || arrow.direction === 'none') {
          console.warn('该连线没有箭头');
          return;
        }
        const pathInfo = store.computeConnectionPath(conn);
        if (!pathInfo) {
          console.warn('无法计算路径');
          return;
        }
        const { startDirection, endDirection, start, end } = pathInfo;

        console.group('箭头信息');
        console.log('连线 ID:', conn.id);
        console.log('箭头配置:', arrow);
        console.log('起点:', start);
        console.log('终点:', end);

        const dir = arrow.direction === 'target' ? endDirection : arrow.direction === 'source' ? startDirection : null;
        if (!dir) {
          console.warn('方向向量为空');
          console.groupEnd();
          return;
        }
        const angleDeg = (Math.atan2(dir.y, dir.x) * 180) / Math.PI;
        console.log('方向向量:', dir);
        console.log('方向角度（度）:', angleDeg);

        const length = arrow.length || Defaults.arrow.length;
        const width = arrow.width || Defaults.arrow.width;
        console.log('箭头长度:', length);
        console.log('箭头宽度:', width);
        const tipAngle = (2 * Math.atan2(width / 2, length) * 180) / Math.PI;
        console.log('箭头顶角（度）:', tipAngle.toFixed(2));
        console.groupEnd();
      };

      console.log('💡 在控制台执行 getArrowInfo() 可查看第一条连线的箭头信息，传入连线ID可查看指定连线');
    </script>
  </body>
</html>
