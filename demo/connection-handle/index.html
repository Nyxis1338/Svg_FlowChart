<!-- demo/connection-handle/index.html -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>连接手柄拖拽测试</title>
    <style>
      body {
        padding: 20px;
        font-family: sans-serif;
        background: #f5f7fa;
      }
      #container {
        width: 100%;
        height: 600px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .tip {
        background: #e3f2fd;
        padding: 8px 14px;
        border-radius: 4px;
        margin-bottom: 12px;
        display: inline-block;
      }
      #log {
        margin-top: 12px;
        padding: 10px;
        background: #1e1e1e;
        color: #d4d4d4;
        border-radius: 4px;
        font-family: monospace;
        font-size: 13px;
        max-height: 120px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <h2>🔗 连接手柄拖拽测试</h2>
    <div class="tip">点击选中节点 → 右下角出现手柄 → 拖拽手柄创建连线</div>
    <div id="container"></div>
    <div id="log">初始化...</div>

    <script type="importmap">
      { "imports": { "svg-flowchart": "../../src/" } }
    </script>
    <script type="module">
      import { SvgEngine } from '../../src/core/SvgEngine';
      import { NodeShape, AnchorPosition, AnchorType, ConnectorType, ArrowDirection } from '../../src/types/SvgModel';
      import { ConnectorColors } from '../../src/styles/defaults';

      const container = document.getElementById('container');
      const chart = new SvgEngine(container);
      window.chart = chart;
      const store = chart.store;
      const logEl = document.getElementById('log');

      function log(msg) {
        logEl.textContent = msg;
        console.log(msg);
      }

      // 创建节点（带连续锚点）
      const nodeA = chart.addNode({
        x: 120,
        y: 120,
        width: 140,
        height: 90,
        label: '手柄节点',
        shape: NodeShape.RECTANGLE,
        stroke: '#7b1fa2',
        strokeWidth: 3,
      });
      chart.addAnchor({ nodeId: nodeA.id, type: AnchorType.CONTINUOUS, direction: 'output', radius: 6 });

      const nodeB = chart.addNode({
        x: 420,
        y: 120,
        width: 140,
        height: 90,
        label: '目标节点',
        shape: NodeShape.RECTANGLE,
      });
      chart.addAnchor({
        nodeId: nodeB.id,
        type: AnchorType.STATIC,
        position: AnchorPosition.LEFT,
        direction: 'input',
        radius: 6,
        fill: '#e8f5e9',
        stroke: '#43a047',
      });

      log('✅ 就绪。点击[手柄节点] → 拖拽右下角手柄到[目标节点]边缘');
    </script>
  </body>
</html>
