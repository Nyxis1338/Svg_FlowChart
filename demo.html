<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>jsPlumb 6.x Community 修复版（无draggable报错）</title>
<link rel="stylesheet" href="jsplumb.css" />
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; }
#toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
button { padding: 6px 12px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; font-size: 13px; }
button.active { background: #7AB02C; color: #fff; border-color: #7AB02C; }
#canvas {
  position: relative;
  width: 100%;
  height: 600px;
  background: #fff;
  border: 2px dashed #ccc;
  overflow: hidden;
}
.jtk-node {
  position: absolute;
  width: 80px;
  height: 80px;
  border: 1px solid #7AB02C;
  border-radius: 6px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #7AB02C;
  user-select: none;
}
.jtk-node.blue { border-color: #3388bb; color: #3388bb; }
.jtk-node.red { border-color: #dd4444; color: #dd4444; }
#a { left: 50px; top: 50px; }
#b { left: 250px; top: 50px; }
#c { left: 450px; top: 50px; }
#d { left: 250px; top: 200px; }
.aLabel {
  background: #fff;
  padding: 4px 8px;
  font-size: 12px;
  border: 1px dashed #999;
  border-radius: 6px;
  opacity: 0.85;
}
</style>
</head>
<body>
<h3>jsPlumb 6.x Community 标准Demo（修复draggable不存在报错）</h3>
<div id="toolbar">
  <button onclick="addNode()">➕ 新增普通节点</button>
  <button onclick="addBlueNode()">🔵 Scope蓝节点</button>
  <button onclick="addRedNode()">🔴 Scope红节点</button>
  <button onclick="connectByUUID()">🔗 UUID连线</button>
  <button onclick="toggleDetach()" id="btn-detach">✂️ 连线可断开：开</button>
  <button onclick="toggleReattach()" id="btn-reattach">↩️ 断线弹回：关</button>
  <button onclick="setConnector('Flowchart')" id="btn-fc">📐 Flowchart</button>
  <button onclick="setConnector('Bezier')" id="btn-bezier">〰️ Bezier</button>
  <button onclick="setConnector('Straight')" id="btn-straight">📏 Straight</button>
  <button onclick="addLabels()">🏷️ 批量标签</button>
  <button onclick="addArrows()">➤ 批量箭头</button>
  <button onclick="switchEndpointType()" id="btn-ep">⬛ 端点Dot</button>
  <button onclick="toggleNodeDrag()">🚫 禁止/允许拖拽</button>
  <button onclick="exportData()">💾 导出JSON</button>
  <button onclick="importData()">📂 导入JSON</button>
  <button onclick="clearAll()">🗑️ 清空</button>
</div>
<div id="canvas"></div>
<script src="jsplumb.browser-ui.umd.js"></script>
<script>
const tk = jsPlumb;
let instance = null;
let nodeCounter = 0;
let currentConnector = "Flowchart";
let endpointType = "Dot";
let savedCanvasData = null;
let dragEnable = true;

// 日志工具
function log(text) {
  console.log(`[${new Date().toLocaleTimeString()}] ${text}`);
}

// 6.x 标准初始化（全局拖拽配置，elementsDraggable默认true）
tk.ready(() => {
  instance = tk.newInstance({
    container: document.getElementById("canvas"),
    // 全局拖拽配置：网格、边界、光标，全局统一生效
    dragOptions: {
      cursor: "pointer",
      zIndex: 2000,
      grid: [20, 20],
      containment: "notNegative"
    },
    elementsDraggable: true, // 托管元素自动可拖拽，6.x默认开启
    connectionsDetachable: true,
    reattachConnections: false,
    connectionOverlays: [
      { type: "Arrow", options: { location: 1, width: 11, length: 11, id: "ARROW" } },
      { type: "Label", options: { location: 0.1, id: "label", cssClass: "aLabel" } }
    ]
  });

  // 全局连线样式
  const connectorPaintStyle = { strokeWidth: 2, stroke: "#61B7CF", outlineStroke: "#fff", outlineWidth: 2 };
  const connectorHoverStyle = { strokeWidth: 3, stroke: "#216477", outlineWidth: 5 };
  const endpointHoverStyle = { fill: "#216477", stroke: "#216477" };

  // 源端点配置
  const sourceEndpoint = {
    endpoint: tk.DotEndpoint.type,
    paintStyle: { stroke: "#7AB02C", fill: "transparent", radius: 7 },
    source: true,
    connector: { type: "Flowchart", options: { stub: [40, 60], gap: 10, cornerRadius: 5 } },
    connectorStyle: connectorPaintStyle,
    hoverPaintStyle: endpointHoverStyle,
    connectorHoverStyle: connectorHoverStyle
  };
  // 目标端点配置
  const targetEndpoint = {
    endpoint: tk.DotEndpoint.type,
    paintStyle: { fill: "#7AB02C", radius: 7 },
    hoverPaintStyle: endpointHoverStyle,
    maxConnections: -1,
    target: true
  };

  const anchorList = [tk.AnchorLocations.Top, tk.AnchorLocations.Right, tk.AnchorLocations.Bottom, tk.AnchorLocations.Left];

  // 初始化连线标签
  const initLabel = (conn) => {
    const label = conn.getOverlay("label");
    label?.setLabel(`${conn.sourceId}-${conn.targetId}`);
  };

  // 批量添加端点（已移除instance.draggable，addEndpoint自动托管开启拖拽）
  const addEndpoints = (el, sourceAnchors, targetAnchors, scope) => {
    const nodeId = el.id;
    sourceAnchors.forEach(anchor => {
      instance.addEndpoint(el, sourceEndpoint, { anchor, uuid: `${nodeId}${anchor}`, scope });
    });
    targetAnchors.forEach(anchor => {
      instance.addEndpoint(el, targetEndpoint, { anchor, uuid: `${nodeId}t${anchor}`, scope });
    });
    // 如需手动托管元素（无端点时用）：instance.manage(el);
  };

  // 批量渲染
  instance.batch(() => {
    // 初始化基础4节点DOM
    createNodeDOM("a", "A");
    createNodeDOM("b", "B");
    createNodeDOM("c", "C");
    createNodeDOM("d", "D");

    addEndpoints(document.getElementById("a"), [tk.AnchorLocations.Top, tk.AnchorLocations.Bottom], [tk.AnchorLocations.Left, tk.AnchorLocations.Right]);
    addEndpoints(document.getElementById("b"), [tk.AnchorLocations.Left, tk.AnchorLocations.Bottom], [tk.AnchorLocations.Top, tk.AnchorLocations.Right]);
    addEndpoints(document.getElementById("c"), [tk.AnchorLocations.Right, tk.AnchorLocations.Bottom], [tk.AnchorLocations.Left, tk.AnchorLocations.Top]);
    addEndpoints(document.getElementById("d"), [tk.AnchorLocations.Left, tk.AnchorLocations.Right], [tk.AnchorLocations.Top, tk.AnchorLocations.Bottom]);

    // 预设UUID连线
    instance.connect({ uuids: ["bBottom", "cTop"] });
    instance.connect({ uuids: ["bLeft", "dLeft"] });
    instance.connect({ uuids: ["dTop", "dRight"] });
    instance.connect({ uuids: ["cRight", "bRight"] });
    instance.connect({ uuids: ["dBottom", "aTop"] });
    instance.connect({ uuids: ["cBottom", "aBottom"] });

    // EVENT常量绑定（6.x社区合法）
    instance.bind(tk.EVENT_CONNECTION, (connInfo) => {
      initLabel(connInfo.connection);
      log(`新建连线：${connInfo.connection.sourceId} → ${connInfo.connection.targetId}`);
    });
    instance.bind(tk.EVENT_CLICK, (conn) => {
      if (confirm(`删除连线 ${conn.sourceId} → ${conn.targetId}`)) instance.deleteConnection(conn);
    });
    instance.bind(tk.EVENT_CONNECTION_DRAG, (conn) => log(`拖拽连线 ${conn.id}`));
    instance.bind(tk.EVENT_CONNECTION_MOVED, (p) => log(`连线重定向 ${p.connection.id}`));
    instance.bind(tk.EVENT_CONNECTION_DETACHED, (p) => log(`连线断开 ${p.connection.id}`));
    instance.bind(tk.EVENT_CONNECTION_ABORT, (conn) => log(`拖拽取消 ${conn.id}`));
    // 节点拖拽事件监听
    instance.bind(tk.EVENT_DRAG_START, (p) => log(`开始拖拽节点 ${p.el.id}`));
    instance.bind(tk.EVENT_DRAG_STOP, (p) => log(`结束拖拽节点 ${p.el.id}`));
  });
  log("🎉 初始化完成，已移除废弃draggable方法，无报错");
});

// 创建节点DOM
function createNodeDOM(id, text, cls = "") {
  const el = document.createElement("div");
  el.id = id;
  el.className = `jtk-node ${cls}`.trim();
  el.innerHTML = `<strong>${text}</strong>`;
  document.getElementById("canvas").appendChild(el);
  return el;
}

// 新增普通节点
function addNode() {
  const id = `n${nodeCounter++}`;
  const el = createNodeDOM(id, id.toUpperCase());
  el.style.left = 50 + Math.random() * 400 + "px";
  el.style.top = 50 + Math.random() * 400 + "px";
  instance.batch(() => {
    ["Top", "Right", "Bottom", "Left"].forEach(anchor => {
      instance.addEndpoint(el, sourceEndpoint, { anchor: tk.AnchorLocations[anchor], uuid: `${id}${anchor}` });
      instance.addEndpoint(el, targetEndpoint, { anchor: tk.AnchorLocations[anchor], uuid: `${id}t${anchor}` });
    });
  });
  log(`新增节点 ${id}`);
}

// Scope隔离节点
function addBlueNode() {
  const id = `b${nodeCounter++}`;
  const el = createNodeDOM(id, id, "blue");
  el.style.left = 50 + Math.random() * 400 + "px";
  el.style.top = 50 + Math.random() * 400 + "px";
  instance.batch(() => {
    ["Top", "Right", "Bottom", "Left"].forEach(anchor => {
      instance.addEndpoint(el, sourceEndpoint, { anchor: tk.AnchorLocations[anchor], uuid: `${id}${anchor}`, scope: "blue" });
      instance.addEndpoint(el, targetEndpoint, { anchor: tk.AnchorLocations[anchor], uuid: `${id}t${anchor}`, scope: "blue" });
    });
  });
  log(`蓝节点${id}，仅同scope互连`);
}
function addRedNode() {
  const id = `r${nodeCounter++}`;
  const el = createNodeDOM(id, id, "red");
  el.style.left = 50 + Math.random() * 400 + "px";
  el.style.top = 50 + Math.random() * 400 + "px";
  instance.batch(() => {
    ["Top", "Right", "Bottom", "Left"].forEach(anchor => {
      instance.addEndpoint(el, sourceEndpoint, { anchor: tk.AnchorLocations[anchor], uuid: `${id}${anchor}`, scope: "red" });
      instance.addEndpoint(el, targetEndpoint, { anchor: tk.AnchorLocations[anchor], uuid: `${id}t${anchor}`, scope: "red" });
    });
  });
  log(`红节点${id}，仅同scope互连`);
}

// UUID连线
function connectByUUID() {
  const nodes = document.querySelectorAll(".jtk-node");
  if (nodes.length < 2) return log("至少2个节点");
  const n1 = nodes[0].id, n2 = nodes[1].id;
  instance.connect({ uuids: [`${n1}Right`, `${n2}Left`] });
  log(`连线 ${n1}Right → ${n2}Left`);
}

// 动态修改全局配置 importDefaults（6.x社区支持）
function toggleDetach() {
  const newVal = !instance.defaults.connectionsDetachable;
  instance.importDefaults({ connectionsDetachable: newVal });
  document.getElementById("btn-detach").textContent = `✂️ 连线可断开：${newVal ? "开" : "关"}`;
  log(`全局可断开：${newVal}`);
}
function toggleReattach() {
  const newVal = !instance.defaults.reattachConnections;
  instance.importDefaults({ reattachConnections: newVal });
  document.getElementById("btn-reattach").textContent = `↩️ 断线弹回：${newVal ? "开" : "关"}`;
  log(`断线弹回：${newVal}`);
}

// 切换连线类型（社区6.x无conn.setConnector，销毁重建）
function setConnector(type) {
  currentConnector = type;
  ["fc", "bezier", "straight"].forEach(k => document.getElementById(`btn-${k}`).classList.remove("active"));
  const btnId = type === "Flowchart" ? "btn-fc" : `btn-${type.toLowerCase()}`;
  document.getElementById(btnId).classList.add("active");
  instance.batch(() => {
    const cache = [];
    instance.getConnections().forEach(conn => {
      cache.push({ uuids: [conn.sourceEndpoint.getUuid(), conn.targetEndpoint.getUuid()] });
      instance.deleteConnection(conn);
    });
    cache.forEach(item => {
      const opt = { uuids: item.uuids };
      if (type === "Flowchart") opt.connector = { type, options: { stub: [40, 60], gap: 10, cornerRadius: 5 } };
      else opt.connector = { type };
      instance.connect(opt);
    });
  });
  log(`切换连接器：${type}`);
}

// 批量添加覆盖层
function addLabels() {
  instance.batch(() => {
    instance.getConnections().forEach((conn, i) => {
      if (!conn.getOverlay("tempLabel")) conn.addOverlay({ type: "Label", options: { id: "tempLabel", label: `L${i+1}`, location: 0.5 } });
    });
  });
  log("添加中间标签");
}
function addArrows() {
  instance.batch(() => {
    instance.getConnections().forEach(conn => {
      if (!conn.getOverlay("tempArrow")) conn.addOverlay({ type: "Arrow", options: { id: "tempArrow", location: 1, width: 12, length: 12 } });
    });
  });
  log("添加箭头");
}

// 切换端点（删除重建，无动态修改API）
function switchEndpointType() {
  endpointType = endpointType === "Dot" ? "Rectangle" : "Dot";
  document.getElementById("btn-ep").textContent = `⬛ 端点：${endpointType}`;
  instance.batch(() => {
    document.querySelectorAll(".jtk-node").forEach(node => {
      instance.deleteEveryEndpoint(node);
      const srcEp = { ...sourceEndpoint, endpoint: endpointType === "Dot" ? tk.DotEndpoint.type : tk.RectangleEndpoint.type };
      const tgtEp = { ...targetEndpoint, endpoint: endpointType === "Dot" ? tk.DotEndpoint.type : tk.RectangleEndpoint.type };
      ["Top", "Right", "Bottom", "Left"].forEach(anchor => {
        instance.addEndpoint(node, srcEp, { anchor: tk.AnchorLocations[anchor], uuid: `${node.id}${anchor}` });
        instance.addEndpoint(node, tgtEp, { anchor: tk.AnchorLocations[anchor], uuid: `${node.id}t${anchor}` });
      });
    });
  });
  log(`切换端点：${endpointType}`);
}

// 开关节点拖拽（官方setDraggable API）
function toggleNodeDrag() {
  dragEnable = !dragEnable;
  document.querySelectorAll(".jtk-node").forEach(el => {
    instance.setDraggable(el, dragEnable);
  });
  log(`全局节点拖拽：${dragEnable ? "开启" : "关闭"}`);
}

// 手动序列化导出（社区6.x无exportData原生API）
function exportData() {
  const nodes = [];
  document.querySelectorAll(".jtk-node").forEach(el => {
    nodes.push({
      id: el.id,
      left: parseInt(el.style.left) || 0,
      top: parseInt(el.style.top) || 0,
      className: el.className
    });
  });
  const connections = instance.getConnections().map(conn => ({
    sourceUuid: conn.sourceEndpoint.getUuid(),
    targetUuid: conn.targetEndpoint.getUuid()
  }));
  savedCanvasData = { nodes, connections, connectorType: currentConnector, endpointType };
  console.log("导出画布数据", savedCanvasData);
  log("数据导出完成");
}
// 手动导入重建
function importData() {
  if (!savedCanvasData) return log("无导出数据");
  clearAll();
  instance.batch(() => {
    savedData.nodes.forEach(n => {
      const el = createNodeDOM(n.id, n.id, n.className.replace("jtk-node", "").trim());
      el.style.left = n.left + "px";
      el.style.top = n.top + "px";
      const srcEp = { ...sourceEndpoint, endpoint: savedData.endpointType === "Dot" ? tk.DotEndpoint.type : tk.RectangleEndpoint.type };
      const tgtEp = { ...targetEndpoint, endpoint: savedData.endpointType === "Dot" ? tk.DotEndpoint.type : tk.RectangleEndpoint.type };
      ["Top", "Right", "Bottom", "Left"].forEach(anchor => {
        instance.addEndpoint(el, srcEp, { anchor: tk.AnchorLocations[anchor], uuid: `${n.id}${anchor}` });
        instance.addEndpoint(el, tgtEp, { anchor: tk.AnchorLocations[anchor], uuid: `${n.id}t${anchor}` });
      });
    });
    savedData.connections.forEach(c => {
      const opt = { uuids: [c.sourceUuid, c.targetUuid] };
      if (savedData.connectorType === "Flowchart") opt.connector = { type: "Flowchart", options: { stub: [40, 60], gap: 10, cornerRadius: 5 } };
      else opt.connector = { type: savedData.connectorType };
      instance.connect(opt);
    });
  });
  log("数据导入完成");
}

// 清空画布
function clearAll() {
  instance.deleteEveryConnection();
  instance.deleteEveryEndpoint();
  document.querySelectorAll(".jtk-node").forEach(el => el.remove());
  nodeCounter = 0;
  log("已清空所有节点连线");
}

// Delete快捷键删连线
document.addEventListener("keydown", e => {
  if (["Delete", "Backspace"].includes(e.key)) {
    const conns = instance.getConnections();
    conns.length && instance.deleteConnection(conns.pop());
  }
});
</script>
</body>
</html>
